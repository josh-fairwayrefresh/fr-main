# Shared Fairway power-sandbox product configuration.
# This file holds the common behavior used by both Profile A and Profile B.
# Profile-specific logging/console settings live in prj_a.conf and prj_b.conf.
CONFIG_GPIO=y
CONFIG_LED=y
CONFIG_LED_NPM13XX=y
CONFIG_SENSOR=y
CONFIG_NPM13XX_CHARGER=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM13XX=y

CONFIG_FUEL_GAUGE=y

CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LIB_TRACE=n
CONFIG_MODEM_INFO=y

CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_LC_CONN_EVAL_MODULE=y
CONFIG_LTE_EDRX_REQ=n
CONFIG_LTE_NETWORK_MODE_LTE_M=y
CONFIG_PDN=y

CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_DNS_RESOLVER=y

CONFIG_MODEM_KEY_MGMT=y