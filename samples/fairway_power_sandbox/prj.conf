# Shared Fairway power-sandbox product configuration.
# This file holds the common behavior used by both Profile A and Profile B.
# Profile-specific logging/console settings live in prj_a.conf and prj_b.conf.
CONFIG_GPIO=y
CONFIG_LED=y
CONFIG_LED_NPM13XX=y
CONFIG_SENSOR=y
CONFIG_NPM13XX_CHARGER=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM13XX=y

CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LIB_TRACE=n

CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_EDRX_REQ=n
CONFIG_LTE_NETWORK_MODE_LTE_M=y
CONFIG_PDN=y

CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_DNS_RESOLVER=y

CONFIG_MODEM_KEY_MGMT=y

CONFIG_JSON_LIBRARY=y
CONFIG_DATE_TIME=y
CONFIG_DOWNLOADER=y
CONFIG_DOWNLOADER_STACK_SIZE=1536

CONFIG_DFU_TARGET=y
CONFIG_DFU_TARGET_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_REBOOT=y
CONFIG_MBEDTLS_MAC_SHA256_ENABLED=y
CONFIG_FAIRWAY_OTA=y
CONFIG_FAIRWAY_OTA_FIRMWARE_VERSION="0.1.0+1"
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.1.0+1"

# Protected Storage uses the configurable TF-M profile and a hardware-unique
# key for encrypted, rollback-protected device state.
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_PARTITION_INTERNAL_TRUSTED_STORAGE=y
CONFIG_TFM_PARTITION_PLATFORM=y
CONFIG_TFM_PARTITION_CRYPTO=y
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=y
CONFIG_TFM_PS_ROLLBACK_PROTECTION=y
CONFIG_PM_PARTITION_SIZE_TFM=0x1fe00
CONFIG_PM_PARTITION_SIZE_TFM_PROTECTED_STORAGE=0x8000
CONFIG_PM_PARTITION_SIZE_TFM_INTERNAL_TRUSTED_STORAGE=0x8000
CONFIG_PM_PARTITION_SIZE_TFM_OTP_NV_COUNTERS=0x8000