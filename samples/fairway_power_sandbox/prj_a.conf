# Profile A: instrumented validation build.
# Keep the normal debug output path so LTE registration, PSM requests, and wake behavior are observable.
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Keep AT monitor enabled for validation builds because it is an optional modem-notification
# utility and is not required for the product logic itself, but it is useful for observing LTE
# notification behavior during instrumentation-driven validation.
CONFIG_AT_MONITOR=y
